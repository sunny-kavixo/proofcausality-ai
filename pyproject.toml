[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcausality-ai"
version = "0.2.6"
description = "Prove what happened. Detect what is missing. Capture the evidence that changes the decision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
    "pydantic>=2.8.0,<3",
    "numpy>=1.26.0,<3",
    "scipy>=1.11.0,<2",
    "pillow>=10.4.0,<14",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0,<10",
    "pytest-cov>=5.0.0,<8",
]
inference = [
    "torch>=2.14.0,<3",
    "torchvision>=0.29.0,<1",
    "transformers>=5.17.0,<6",
    "huggingface-hub>=1.0.0,<2",
]

[tool.setuptools.packages.find]
include = ["backend*", "evaluation*", "frontend*", "scripts*"]

[tool.setuptools.package-data]
frontend = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --quiet"
markers = [
    "coco_dataset: requires locally downloaded COCO photographs excluded from release archives",
    "local_model: requires optional inference dependencies and a locally available model checkpoint",
]
