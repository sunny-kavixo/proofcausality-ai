<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M 100,0 V 650 M 300,0 V 650 M 500,0 V 650 M 700,0 V 650 M 900,0 V 650" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" />
  <path d="M 0,100 H 1000 M 0,250 H 1000 M 0,400 H 1000 M 0,550 H 1000" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" />

  <!-- Title -->
  <text x="500" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">ReCapture™ Closed-Loop Targeted Evidence Recovery</text>
  <text x="500" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Closed-loop workflow transitioning UNCERTAIN verdicts into verified decisions via Value of Information</text>

  <!-- Step 1: Initial Observation & Deficit Detection -->
  <rect x="60" y="140" width="240" height="180" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <rect x="60" y="140" width="240" height="36" rx="12" fill="#1e293b" />
  <text x="180" y="164" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Perceptual Deficit</text>
  <text x="80" y="200" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Initial Capture (t1)</text>
  <text x="80" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Motion Blur (Var &lt; 100)</text>
  <text x="80" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Border Clipping (&lt; 3px margin)</text>
  <text x="80" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Gripper Occlusion (&gt; 35% drop)</text>
  <rect x="80" y="285" width="200" height="22" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1" />
  <text x="180" y="300" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Verdict: UNCERTAIN</text>

  <!-- Step 2: Evidence Debt & VOI Planning -->
  <rect x="380" y="140" width="240" height="180" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <rect x="380" y="140" width="240" height="36" rx="12" fill="#1e293b" />
  <text x="500" y="164" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. VOI Budget Planner</text>
  <text x="400" y="200" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Evidence Debt D(E,T) &gt; 0</text>
  <text x="400" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Maximize ΔRisk(a) - λ·Cost(a)</text>
  <text x="400" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Targeted Directive Generation</text>
  <text x="400" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Estimated Effort: 4.5 – 8.2s</text>
  <rect x="400" y="285" width="200" height="22" rx="4" fill="#172554" stroke="#2563eb" stroke-width="1" />
  <text x="500" y="300" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Optimal Action Ranked</text>

  <!-- Step 3: Human / Robotic Follow-Up Capture -->
  <rect x="700" y="140" width="240" height="180" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <rect x="700" y="140" width="240" height="36" rx="12" fill="#1e293b" />
  <text x="820" y="164" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Targeted ReCapture</text>
  <text x="720" y="200" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Corrective Execution</text>
  <text x="720" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Stabilize camera 2.0s</text>
  <text x="720" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Pan right 15cm unblocking line</text>
  <text x="720" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Pull back 20cm canvas margin</text>
  <rect x="720" y="285" width="200" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="820" y="300" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">New Frame (t2) Acquired</text>

  <!-- Step 4: Closed-Loop Transition & Merkle Receipt -->
  <rect x="220" y="410" width="560" height="160" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5" />
  <rect x="220" y="410" width="560" height="36" rx="12" fill="#064e3b" />
  <text x="500" y="434" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Decision Transition &amp; Evidence Receipt Verification</text>
  <text x="250" y="475" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Verdict Transition: UNCERTAIN ➔ SUCCESS (or FAILED if falsified)</text>
  <text x="250" y="500" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Evidence Debt Cleared: D(E,T) = 0.00 | P_SHARP &amp; P_SPATIAL Supported</text>
  <text x="250" y="520" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Emits Linked Cryptographic SHA-256 Merkle Receipt (RC-xxxx)</text>
  <text x="250" y="540" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Endpoint: POST /api/recapture/evaluate-followup (Verified 100% Transition Parity)</text>

  <!-- Connecting Arrows -->
  <path d="M 300,230 H 380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 620,230 H 700" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 820,320 V 490 H 780" stroke="#10b981" stroke-width="2" fill="none" />
  <path d="M 220,490 H 180 V 320" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
  <text x="170" y="410" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Audit Trail Linked</text>
</svg>