<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <path d="M 100,0 V 700 M 200,0 V 700 M 300,0 V 700 M 400,0 V 700 M 500,0 V 700 M 600,0 V 700 M 700,0 V 700 M 800,0 V 700 M 900,0 V 700 M 1000,0 V 700" stroke="#172033" stroke-width="0.5" stroke-dasharray="4,4" />
  <path d="M 0,70 H 1100 M 0,170 H 1100 M 0,270 H 1100 M 0,370 H 1100 M 0,470 H 1100 M 0,570 H 1100 M 0,670 H 1100" stroke="#172033" stroke-width="0.5" stroke-dasharray="4,4" />

  <!-- Header -->
  <text x="550" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="1">
    PROOFCAUSALITY AI — PHASE 2 EVIDENCE CALCULUS ARCHITECTURE
  </text>
  <text x="550" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#06b6d4">
    "Prove what happened. Detect what is missing. Capture the evidence that changes the decision."
  </text>

  <!-- COLUMN 1: PERCEPTION & OBSERVATIONS -->
  <rect x="50" y="110" width="220" height="540" rx="8" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1.5" />
  <rect x="50" y="110" width="220" height="36" rx="8" fill="#1f2937" />
  <text x="160" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.5">1. SENSORY OBSERVATIONS</text>

  <rect x="70" y="165" width="180" height="70" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="160" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Dual-Frame Capture</text>
  <text x="160" y="212" text-anchor="middle" font-family="monospace" font-size="10" fill="#9ca3af">t=0 Initial / t=T Final</text>

  <rect x="70" y="255" width="180" height="75" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="160" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Meta SAM / Foundation</text>
  <text x="160" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#9ca3af">Segment-Anything Adapter</text>
  <text x="160" y="318" text-anchor="middle" font-family="monospace" font-size="9" fill="#06b6d4">Zero-Shot Mask Extraction</text>

  <rect x="70" y="350" width="180" height="85" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="160" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Rust Native SIMD Kernel</text>
  <text x="160" y="395" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981">11.35x Batch IoU Speedup</text>
  <text x="160" y="412" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981">3.52x Blur Variance (SIMD)</text>
  <text x="160" y="426" text-anchor="middle" font-family="monospace" font-size="9" fill="#6b7280">Python/C-ABI Parity Checked</text>

  <rect x="70" y="455" width="180" height="70" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="160" y="480" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Detector Independence</text>
  <text x="160" y="500" text-anchor="middle" font-family="monospace" font-size="10" fill="#9ca3af">Error Correlation Matrix</text>
  <text x="160" y="514" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">Dependence-Aware Discounting</text>

  <!-- COLUMN 2: EVIDENCE CALCULUS CORE -->
  <rect x="310" y="110" width="480" height="540" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="2" />
  <rect x="310" y="110" width="480" height="36" rx="8" fill="#164e63" />
  <text x="550" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#67e8f9" letter-spacing="0.5">2. EVIDENCE CALCULUS ENGINE (H01 - H04)</text>

  <!-- Sub-box 1: Directed Evidence Dependency Graph -->
  <rect x="330" y="165" width="440" height="135" rx="6" fill="#0b0f19" stroke="#1e293b" />
  <text x="345" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Directed Evidence Dependency Graph (H02)</text>
  <text x="345" y="210" font-family="sans-serif" font-size="11" fill="#9ca3af">Observation -> Detection -> Mask -> Spatial Measurement -> Predicate -> Decision</text>
  <rect x="345" y="225" width="95" height="30" rx="4" fill="#1e293b" stroke="#374151" />
  <text x="392" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">OBSERVATION</text>
  <text x="448" y="244" font-family="monospace" font-size="12" fill="#64748b">-></text>
  <rect x="465" y="225" width="90" height="30" rx="4" fill="#1e293b" stroke="#374151" />
  <text x="510" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">DETECTION</text>
  <text x="562" y="244" font-family="monospace" font-size="12" fill="#64748b">-></text>
  <rect x="580" y="225" width="85" height="30" rx="4" fill="#1e293b" stroke="#374151" />
  <text x="622" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">PREDICATE</text>
  <text x="672" y="244" font-family="monospace" font-size="12" fill="#64748b">-></text>
  <rect x="690" y="225" width="65" height="30" rx="4" fill="#164e63" stroke="#06b6d4" />
  <text x="722" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#67e8f9">VERDICT</text>
  <text x="345" y="280" font-family="sans-serif" font-size="10" fill="#10b981">100.0% Mathematical Output Parity on Incremental Recompute</text>

  <!-- Sub-box 2: Tri-State Observable Predicates -->
  <rect x="330" y="315" width="440" height="150" rx="6" fill="#0b0f19" stroke="#1e293b" />
  <text x="345" y="340" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Tri-State Predicate Decomposition</text>
  <text x="345" y="360" font-family="sans-serif" font-size="11" fill="#9ca3af">Replaces single confidence score with explicit testable preconditions:</text>
  <rect x="345" y="375" width="130" height="40" rx="4" fill="#064e3b" stroke="#10b981" />
  <text x="410" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">SUPPORTED</text>
  <text x="410" y="407" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a7f3d0">Visual proof observed</text>
  <rect x="485" y="375" width="130" height="40" rx="4" fill="#78350f" stroke="#f59e0b" />
  <text x="550" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">UNOBSERVABLE</text>
  <text x="550" y="407" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fde68a">Blur/occlusion/clipped</text>
  <rect x="625" y="375" width="130" height="40" rx="4" fill="#7f1d1d" stroke="#ef4444" />
  <text x="690" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">CONTRADICTED</text>
  <text x="690" y="407" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fecaca">Physical falsification</text>
  <text x="345" y="445" font-family="sans-serif" font-size="10" fill="#94a3b8">Predicates: P_IDENT, P_INIT, P_FINAL, P_SPATIAL, P_SHARP, P_FRAME, P_OCCL, P_PHYS</text>

  <!-- Sub-box 3: Evidence Debt Formula -->
  <rect x="330" y="480" width="440" height="150" rx="6" fill="#0b0f19" stroke="#1e293b" />
  <text x="345" y="505" font-family="sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Physics-Constrained Evidence Debt: D(E, T)</text>
  <text x="345" y="530" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8">D(E,T) = SUM_{c in critical} w_c * deficit(c)</text>
  <text x="345" y="555" font-family="sans-serif" font-size="10" fill="#9ca3af">- Missing evidence penalty: w * 1.0 (Abstains when crucial state is unobserved)</text>
  <text x="345" y="572" font-family="sans-serif" font-size="10" fill="#9ca3af">- Contradiction penalty: w * 2.0 (Immediate falsification priority)</text>
  <text x="345" y="590" font-family="sans-serif" font-size="10" fill="#9ca3af">- Non-teleportation velocity bound: v_max &lt;= 500 px/frame</text>
  <text x="345" y="612" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">Empirical Result: 0.0% False-Success Rate on 37 Held-Out Cases</text>

  <!-- COLUMN 3: DECISION & RECOVERY -->
  <rect x="830" y="110" width="220" height="540" rx="8" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1.5" />
  <rect x="830" y="110" width="220" height="36" rx="8" fill="#1f2937" />
  <text x="940" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.5">3. ARBITRATION & RECOVERY</text>

  <rect x="850" y="165" width="180" height="100" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="940" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Decision Layer</text>
  <text x="940" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#10b981">SUCCESS: D(E,T) = 0</text>
  <text x="940" y="228" text-anchor="middle" font-family="monospace" font-size="11" fill="#f59e0b">UNCERTAIN: D(E,T) > 0</text>
  <text x="940" y="246" text-anchor="middle" font-family="monospace" font-size="11" fill="#ef4444">FAILED: Contra > 0</text>

  <rect x="850" y="280" width="180" height="120" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="940" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Evidence Budget Planner</text>
  <text x="940" y="325" text-anchor="middle" font-family="monospace" font-size="9" fill="#06b6d4">Value-of-Information (VOI)</text>
  <text x="940" y="345" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9ca3af">max_a E[Delta Risk] - c(a)</text>
  <text x="940" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#10b981">95.0% Resolution Rate</text>
  <text x="940" y="382" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">(vs 30% generic advice)</text>

  <rect x="850" y="415" width="180" height="80" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="940" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Evidence Receipts</text>
  <text x="940" y="460" text-anchor="middle" font-family="monospace" font-size="10" fill="#9ca3af">SHA-256 Merkle Hash</text>
  <text x="940" y="478" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981">Tamper-Evident Receipt</text>

  <rect x="850" y="510" width="180" height="85" rx="6" fill="#0b0f19" stroke="#374151" />
  <text x="940" y="535" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Interactive UI &amp; API</text>
  <text x="940" y="555" text-anchor="middle" font-family="monospace" font-size="10" fill="#9ca3af">FastAPI Endpoints</text>
  <text x="940" y="572" text-anchor="middle" font-family="monospace" font-size="10" fill="#06b6d4">Calculus DAG Visualizer</text>
</svg>
