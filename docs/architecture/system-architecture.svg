<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <path d="M 50,0 V 650 M 150,0 V 650 M 250,0 V 650 M 350,0 V 650 M 450,0 V 650 M 550,0 V 650 M 650,0 V 650 M 750,0 V 650 M 850,0 V 650 M 950,0 V 650" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" />
  <path d="M 0,50 H 1000 M 0,150 H 1000 M 0,250 H 1000 M 0,350 H 1000 M 0,450 H 1000 M 0,550 H 1000" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" />

  <!-- Header -->
  <text x="500" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="1">
    PROOFCAUSALITY AI — ARCHITECTURE &amp; EVIDENCE PIPELINE
  </text>
  <text x="500" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#06b6d4">
    Prove what happened. Detect what is missing. Capture the evidence that changes the decision.
  </text>

  <!-- Layer 1: Inputs & Multi-Modal Ingestion -->
  <g transform="translate(60, 110)">
    <rect width="250" height="150" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="30" rx="10" fill="#1e293b" />
    <text x="15" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8">INGESTION &amp; OBSERVATION</text>

    <text x="15" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Temporal Image Pairs (Before/After)</text>
    <text x="15" y="80" font-family="sans-serif" font-size="12" fill="#e2e8f0">• COCO Annotations &amp; Polygons</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Bounding Coordinates &amp; Classes</text>
    <text x="15" y="130" font-family="sans-serif" font-size="12" fill="#06b6d4">• Meta SAM 2 / Llama 3.2 Vision</text>
  </g>

  <!-- Layer 2: EvidenceCore (Uncertainty & Measurement) -->
  <g transform="translate(375, 110)">
    <rect width="250" height="150" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="2" />
    <rect width="250" height="30" rx="10" fill="#0e7490" />
    <text x="15" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">EVIDENCECORE ENGINE</text>

    <text x="15" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0">• 2D Laplacian Blur Convolution</text>
    <text x="15" y="80" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Boundary Escape &amp; Framing Risk</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Severe Occlusion (Area Ratio)</text>
    <text x="15" y="130" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Temporal State Absence Sensor</text>
  </g>

  <!-- Layer 3: Application Engines (LabelCourt & ActionProof) -->
  <g transform="translate(690, 110)">
    <rect width="250" height="150" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="250" height="30" rx="10" fill="#1d4ed8" />
    <text x="15" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">VERIFICATION ENGINES</text>

    <text x="15" y="55" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">LabelCourt: Audit Engine</text>
    <text x="25" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8">IoU, Boundary, Overlap, Review</text>

    <text x="15" y="105" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">ActionProof: Physical Verifier</text>
    <text x="25" y="125" font-family="sans-serif" font-size="11" fill="#94a3b8">A-to-B Displacement, Proximity, State</text>
  </g>

  <!-- Horizontal Connections -->
  <line x1="310" y1="185" x2="375" y2="185" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="625" y1="185" x2="690" y2="185" stroke="#3b82f6" stroke-width="2" />

  <!-- Tri-State Decision Layer -->
  <g transform="translate(60, 310)">
    <rect width="880" height="110" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />

    <text x="25" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">TRI-STATE DECISION ARBITRATION</text>

    <!-- Success -->
    <rect x="50" y="45" width="220" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="160" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">SUCCESS / ACCEPT</text>
    <text x="160" y="84" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a7f3d0">Displacement &amp; Visibility Confirmed</text>

    <!-- Failed -->
    <rect x="330" y="45" width="220" height="50" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
    <text x="440" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171">FAILED / REVIEW</text>
    <text x="440" y="84" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fecaca">Measurable Deficit or Discrepancy</text>

    <!-- Uncertain -->
    <rect x="610" y="45" width="220" height="50" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="720" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24">UNCERTAIN</text>
    <text x="720" y="84" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fde68a">Missing Evidence (Zero False Success)</text>
  </g>

  <!-- Connect Layer 2/3 to Tri-state -->
  <line x1="815" y1="260" x2="815" y2="310" stroke="#3b82f6" stroke-width="2" />

  <!-- Bottom Row: ReCapture Planner & Evidence Receipts -->
  <!-- ReCapture -->
  <g transform="translate(60, 460)">
    <rect width="415" height="150" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="415" height="30" rx="10" fill="#78350f" />
    <text x="15" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#fef3c7">RECAPTURE PLANNER</text>

    <text x="15" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Deterministic Recovery Action Directives</text>
    <text x="15" y="78" font-family="sans-serif" font-size="11" fill="#cbd5e1">  - BLUR: "Hold camera steady; allow autofocus lock."</text>
    <text x="15" y="98" font-family="sans-serif" font-size="11" fill="#cbd5e1">  - OUT_OF_FRAME: "Move camera back; preserve margins."</text>
    <text x="15" y="118" font-family="sans-serif" font-size="11" fill="#cbd5e1">  - OCCLUSION: "Retract hand; capture undisturbed state."</text>
    <text x="15" y="138" font-family="sans-serif" font-size="11" font-weight="600" fill="#10b981">Empirical Result: 100% Re-Capture Resolution Rate</text>
  </g>

  <!-- Evidence Receipts -->
  <g transform="translate(525, 460)">
    <rect width="415" height="150" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="415" height="30" rx="10" fill="#064e3b" />
    <text x="15" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#d1fae5">EVIDENCE RECEIPTS (AUDIT TRAIL)</text>

    <text x="15" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Canonical Deterministic JSON Serialization</text>
    <text x="15" y="78" font-family="sans-serif" font-size="11" fill="#cbd5e1">• SHA-256 Digest of Observations &amp; Signals</text>
    <text x="15" y="98" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Cryptographic Tamper-Proof Audit Trail</text>
    <text x="15" y="118" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Separation of File Integrity vs Factual Truth</text>
    <text x="15" y="138" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Empirical Result: 0.0% False-Success Rate (vs 80% Naive)</text>
  </g>

  <!-- Arrow from Uncertain to ReCapture -->
  <line x1="720" y1="420" x2="267" y2="460" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Arrow from Decision to Receipts -->
  <line x1="440" y1="420" x2="732" y2="460" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
</svg>
