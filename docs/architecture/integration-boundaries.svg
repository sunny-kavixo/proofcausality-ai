  <text x="185" y="164" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Python / FastAPI (Core)</text>
  <text x="70" y="200" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">[IMPLEMENTED &amp; TESTED]</text>
  <text x="70" y="225" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Evidence Calculus Engine (engine.py)</text>
  <text x="70" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - 8 Observable Predicates (Tri-State)</text>
  <text x="70" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - Evidence Debt D(E,T) Calculation</text>
  <text x="70" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - Strict Finite Threshold Validation</text>
  <text x="70" y="310" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• LabelCourt Auditor (auditor.py)</text>
  <text x="70" y="330" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - IoU, Boundary F1, Area Ratios</text>
  <text x="70" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - Fallback vs Independent Tagging</text>
  <text x="70" y="375" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• ActionProof Verifier (verifier.py)</text>
  <text x="70" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - Position Verification vs Rest Claims</text>
  <text x="70" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - Blur Variance &amp; Spatial Containment</text>
  <text x="70" y="440" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• ReCapture Recovery (recapture.py)</text>
  <text x="70" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - Decision Transition &amp; Linked Receipts</text>
  <text x="70" y="485" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Cryptographic Receipts (receipts.py)</text>
  <text x="70" y="505" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - Deterministic SHA-256 Merkle Output</text>
  <text x="70" y="530" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• REST API Endpoints (routes.py)</text>
  <text x="70" y="550" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - /api/calculus/evaluate (p50: 0.73ms)</text>
  <text x="70" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - /api/actionproof/verify (p50: 0.97ms)</text>
  <text x="70" y="595" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">97 Automated Tests Passing (0.32s)</text>

