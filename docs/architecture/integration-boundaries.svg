  <text x="680" y="435" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Meta Llama 3.2 Vision Interface</text>
  <text x="680" y="455" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">  - audit_scene_context_with_llama()</text>
