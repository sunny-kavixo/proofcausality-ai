  <text x="370" y="200" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">[IMPLEMENTED &amp; BENCHMARKED]</text>
  <text x="370" y="225" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• libproofcausality_core.dylib (v0.2.2)</text>
