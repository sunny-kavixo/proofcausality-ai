<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Evidence Calculus Decision Flow &amp; Tri-State Arbitration</text>
  <text x="500" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Decomposition of physical action verification into 8 typed observable predicates</text>

  <!-- Observations Input -->
  <rect x="50" y="120" width="220" height="470" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="50" y="120" width="220" height="32" rx="8" fill="#1e293b" />
  <text x="160" y="142" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Visual Observations (E)</text>
  <text x="70" y="180" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Initial Frame (t0)</text>
  <text x="70" y="205" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Final Frame (t1)</text>
  <text x="70" y="230" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Proposal Coordinates</text>
  <text x="70" y="255" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Canvas Margins (640x480)</text>
  <text x="70" y="280" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Laplacian Kernel Output</text>
  <text x="70" y="305" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Mask Contour Ratio</text>
  <text x="70" y="330" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Temporal Continuity</text>

  <!-- 8 Observable Predicates -->
  <rect x="330" y="120" width="340" height="470" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="330" y="120" width="340" height="32" rx="8" fill="#0369a1" />
  <text x="500" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">8 Observable Predicates (Tri-State)</text>

  <rect x="350" y="170" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="193" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_IDENT: Geometric Localization Assumed</text>

  <rect x="350" y="215" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="238" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_INIT: Initial Region A Containment</text>

  <rect x="350" y="260" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="283" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_SPATIAL: Target Region B + Δx &gt;= θ_disp</text>

  <rect x="350" y="305" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="328" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_SHARP: Laplacian Variance &gt;= 100.0</text>

  <rect x="350" y="350" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="373" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_FRAME: Border Margin &gt;= 3px</text>

  <rect x="350" y="395" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="418" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_OCCL: Surface Retention (&lt; 35% drop)</text>

  <rect x="350" y="440" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="463" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_PHYS: 2D Velocity Heuristic (&lt;= 500px)</text>

  <rect x="350" y="485" width="300" height="36" rx="6" fill="#1e293b" />
  <text x="365" y="508" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">P_FINAL: Position vs Rest Evidence Proof</text>

  <rect x="350" y="535" width="300" height="40" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1" />
  <text x="500" y="559" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Evidence Debt: D(E,T) = Σ w_c · deficit(c)</text>

  <!-- Arbitration Decision Output -->
  <rect x="730" y="120" width="220" height="470" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="730" y="120" width="220" height="32" rx="8" fill="#1e293b" />
  <text x="840" y="142" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Arbitrated Decisions</text>

  <!-- FAILED Branch -->
  <rect x="750" y="180" width="180" height="80" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="840" y="210" fill="#f87171" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">FAILED</text>
  <text x="840" y="230" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Any Contradiction Found</text>
  <text x="840" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Falsification priority (0% FSR)</text>

  <!-- UNCERTAIN Branch -->
  <rect x="750" y="290" width="180" height="95" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
  <text x="840" y="320" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">UNCERTAIN</text>
  <text x="840" y="340" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">D(E,T) &gt; 0 (Missing Proof)</text>
  <text x="840" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Blur, occlusion, border escape,</text>
  <text x="840" y="370" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">or unverified resting state</text>

  <!-- SUCCESS Branch -->
  <rect x="750" y="415" width="180" height="85" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="840" y="445" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">SUCCESS</text>
  <text x="840" y="465" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">D(E,T) = 0 &amp; 0 Contradictions</text>
  <text x="840" y="480" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Full verifiable visual proof</text>

  <!-- ReCapture Trigger from UNCERTAIN -->
  <rect x="750" y="525" width="180" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="840" y="545" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">➔ ReCapture™ Trigger</text>
  <text x="840" y="560" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Issues VOI recovery directive</text>
</svg>