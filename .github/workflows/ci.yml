name: ProofCausality AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust Native Acceleration Kernel
      run: |
        cd native/proofcausality_core
        cargo build --release

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Pytest Suite (61 tests)
      run: |
        python -m pytest tests/ -v --cov=backend --cov-report=term-missing

    - name: Run Synthetic Benchmark Verification
      run: |
        python -m evaluation.benchmark

    - name: Run Real-World Tabletop Benchmark Verification
      run: |
        python -m evaluation.benchmark_real

    - name: Run Comparative Latency Profiling
      run: |
        python -m evaluation.benchmark_rust_speedup
