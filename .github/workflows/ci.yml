name: ProofCausality AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust Native Acceleration Kernel
      run: |
        cd native/proofcausality_core
        cargo build --release

    - name: Run Rust Unit Tests
      run: |
        cd native/proofcausality_core
        cargo test --verbose

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Pytest Regression Suite
      run: |
        python -m pytest tests/ -v --cov=backend --cov-report=term-missing

    - name: Run Synthetic Benchmark Verification
      run: |
        python -m evaluation.benchmark

    - name: Run Real-World Tabletop Benchmark Verification
      run: |
        python -m evaluation.benchmark_real

    - name: Run Authentic Photographic COCO Benchmark Verification
      run: |
        python -m evaluation.benchmarks.labelcourt_real_benchmark

    - name: Run Comparative Latency Profiling
      run: |
        python -m evaluation.benchmark_rust_speedup

  model-smoke-test:
    name: Genuine Mask2Former Model Inference Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-model-ci')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust Native Acceleration Kernel
      run: |
        cd native/proofcausality_core
        cargo build --release

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Genuine Mask2Former Model Smoke Test
      env:
        CI_ALLOW_MODEL_DOWNLOAD: "1"
      run: |
        python scripts/run_genuine_model_smoke_test.py

    - name: Upload Smoke Test Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: model-smoke-test-report
        path: docs/benchmarks/model_smoke_test_report.json
        retention-days: 7

